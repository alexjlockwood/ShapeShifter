name: CI

on:
  push:
    branches: [master]
  pull_request:
  # `gh workflow run CI --ref <branch>` tests a branch in every browser, like master.
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The quick checks go first, so that they fail before the browser is installed.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - uses: ./.github/actions/install-playwright
        with:
          browsers: chromium
      - run: npm run test:run
      # Not `npm run build`, which would type check again.
      - run: npx vite build

  # Whether a pull request changes anything besides Markdown, which the end-to-end tests can't catch
  # problems in. The checks job still runs, since src/test/agentDocs.spec.ts checks the docs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request checks out a merge commit, whose first parent is the base branch.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- ':!*.md'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests only test Chromium, which needs fewer shards. Master tests every browser.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2]' || '[1, 2, 3, 4]') }}
    env:
      BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/install-playwright
        with:
          browsers: ${{ env.BROWSERS }}
      # `chromium*` matches both chromium and chromium-preview.
      - run: >-
          npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          ${{ github.event_name == 'pull_request' && '"--project=chromium*"' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
