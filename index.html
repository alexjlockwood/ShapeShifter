  <body>
    <div id="root"></div>
    <script>
      // Browsers older than the build's target (Vite's default, about Chrome 111, Firefox 114, and
      // Safari 16.4) can't parse or run the app's code, and it fails before it can show or report
      // anything, leaving a blank page. This classic script runs in any browser, so it checks for
      // the newest things the code relies on and says what's wrong instead. It has to stay ES5.
      (function () {
        var supported;
        try {
          supported =
            typeof structuredClone === 'function' &&
            typeof Array.prototype.findLastIndex === 'function' &&
            // Syntax that Safari only parses from 16.4 on: class static blocks and lookbehind.
            !!new Function('class A { static {} }') &&
            !!new RegExp('(?<=a)b');
        } catch (e) {
          supported = false;
        }
        if (supported) {
          return;
        }
        var message = document.createElement('div');
        message.setAttribute('role', 'alert');
        message.style.cssText =
          'position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10000; padding: 48px;' +
          ' background: #fff; color: #212121; text-align: center;' +
          ' font: 16px/1.5 Roboto, Helvetica, Arial, sans-serif;';
        message.innerHTML =
          '<h1 style="font-size: 24px; font-weight: 500">Shape Shifter needs a newer browser</h1>' +
          '<p>Update your browser, or open this page in the latest Chrome, Firefox, Safari, or' +
          ' Edge.</p>';
        document.body.appendChild(message);
      })();
    </script>
    <noscript>Sorry, JavaScript needs to be enabled in order to run this application.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
